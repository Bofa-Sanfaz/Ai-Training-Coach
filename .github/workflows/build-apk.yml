name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install
          npm install -g @capacitor/cli

      - name: Clean Native Android Directory
        run: |
          rm -rf android

      - name: Initialize Android Native Project as Separate V2 App
        run: |
          npx cap add android
          npx cap sync android

          # 1. Inject Deep Link Scheme for V2
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<\/activity>/i \
          <intent-filter>\
              <action android:name="android.intent.action.VIEW" />\
              <category android:name="android.intent.category.DEFAULT" />\
              <category android:name="android.intent.category.BROWSABLE" />\
              <data android:scheme="aicoachv2" android:host="aicoach.app" />\
          </intent-filter>' "$MANIFEST"

          # 2. Set App Display Name
          STRINGS="android/app/src/main/res/values/strings.xml"
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Ride Partner V2<\/string>/g' "$STRINGS"
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">Ride Partner V2<\/string>/g' "$STRINGS"

          # 3. Dynamic Version Code (Increments automatically on every GitHub build)
          node -e '
            const fs = require("fs");
            const file = "android/app/build.gradle";
            let content = fs.readFileSync(file, "utf8");
            content = content.replace(/versionCode\s+[0-9]+/g, "versionCode ${{ github.run_number }}");
            fs.writeFileSync(file, content, "utf8");
          '

          # 4. Overwrite Launcher Icons with Custom Bike Vector
          mkdir -p android/app/src/main/res/drawable
          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FC5200"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M66.5,33.5c3.3,0 6,-2.7 6,-6s-2.7,-6 -6,-6 -6,2.7 -6,6 2.7,6 6,6zM35,53c-8.4,0 -15,6.6 -15,15s6.6,15 15,15 15,-6.6 15,-15 -6.6,-15 -15,-15zm0,25.5c-5.7,0 -10.5,-4.8 -10.5,-10.5s4.8,-10.5 10.5,-10.5 10.5,4.8 10.5,10.5 -4.8,10.5 -10.5,10.5zm17.4,-30l7.2,-7.2 2.4,2.4c3.9,3.9 9,6.3 15,6.3V44c-4.5,0 -8.7,-1.8 -12,-4.8l-5.4,-5.4c-1.2,-1.2 -2.7,-1.8 -4.2,-1.8 -1.8,0 -3.3,0.6 -4.5,1.8L39.5,45.2c-1.2,1.2 -1.5,2.7 -1.5,4.2 0,1.8 0.6,3.3 1.8,4.5l10.2,10.2v12.9h6v-15.3l-6.6,-6.6 3,-8.7zM77,53c-8.4,0 -15,6.6 -15,15s6.6,15 15,15 15,-6.6 15,-15 -6.6,-15 -15,-15zm0,25.5c-5.7,0 -10.5,-4.8 -10.5,-10.5s4.8,-10.5 10.5,-10.5 10.5,4.8 10.5,10.5 -4.8,10.5 -10.5,10.5z"/>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0F172A"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

      - name: Ensure Persistent Signing Keystore
        run: |
          mkdir -p ~/.android
          if [ -f "persistent-keystore.jks" ]; then
            echo "Reusing existing persistent keystore from repository..."
            cp persistent-keystore.jks ~/.android/debug.keystore
          else
            echo "Generating persistent keystore for V2 for the first time..."
            keytool -genkeypair -v -keystore persistent-keystore.jks -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=RidePartnerV2,O=SportsScience,C=TR"
            cp persistent-keystore.jks ~/.android/debug.keystore

            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add persistent-keystore.jks
            git commit -m "chore: persist signing keystore for future seamless updates [skip ci]" || true
            git push origin main || true
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ride_Partner_V2_Release
          path: android/app/build/outputs/apk/debug/app-debug.apk
