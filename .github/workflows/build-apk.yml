name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install
          npm install -g @capacitor/cli

      - name: Initialize Android Native Project & Deep Link Scheme
        run: |
          npx cap add android || true
          npx cap sync android
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "aicoach" "$MANIFEST"; then
            echo "Deep link scheme already present"
          else
            sed -i '/<\/activity>/i \
            <intent-filter>\
                <action android:name="android.intent.action.VIEW" />\
                <category android:name="android.intent.category.DEFAULT" />\
                <category android:name="android.intent.category.BROWSABLE" />\
                <data android:scheme="aicoach" android:host="aicoach.app" />\
            </intent-filter>' "$MANIFEST"
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Coach_Release
          path: android/app/build/outputs/apk/debug/app-debug.apk
