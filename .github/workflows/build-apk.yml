name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install
          npm install -g @capacitor/cli

      - name: Clean Native Android Directory
        run: |
          rm -rf android

      - name: Initialize Android Native Project as Separate V2 App
        run: |
          npx cap add android
          npx cap sync android

          # 1. Inject Deep Link Scheme for V2
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<\/activity>/i \
          <intent-filter>\
              <action android:name="android.intent.action.VIEW" />\
              <category android:name="android.intent.category.DEFAULT" />\
              <category android:name="android.intent.category.BROWSABLE" />\
              <data android:scheme="aicoachv2" android:host="aicoach.app" />\
          </intent-filter>' "$MANIFEST"

          # 2. Set App Display Name
          STRINGS="android/app/src/main/res/values/strings.xml"
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Ride Partner V2<\/string>/g' "$STRINGS"
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">Ride Partner V2<\/string>/g' "$STRINGS"

          # 3. Dynamic Version Code (Increments automatically on every GitHub build)
          node -e '
            const fs = require("fs");
            const file = "android/app/build.gradle";
            let content = fs.readFileSync(file, "utf8");
            content = content.replace(/versionCode\s+[0-9]+/g, "versionCode ${{ github.run_number }}");
            fs.writeFileSync(file, content, "utf8");
          '

          # 4. Overwrite All Adaptive and Legacy Launcher Icons
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26

          # Background (Dark Slate)
          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0F172A"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          # Foreground (Orange Accent Ring + Cyclist Vector)
          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FC5200"
                  android:pathData="M54,14 A40,40 0 1,0 54,94 A40,40 0 1,0 54,14 Z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M64,36c2.8,0 5,-2.2 5,-5s-2.2,-5 -5,-5 -5,2.2 -5,5 2.2,5 5,5zM38,52c-7,0 -12.5,5.5 -12.5,12.5s5.5,12.5 12.5,12.5 12.5,-5.5 12.5,-12.5 -5.5,-12.5 -12.5,-12.5zm0,21.2c-4.8,0 -8.7,-3.9 -8.7,-8.7s3.9,-8.7 8.7,-8.7 8.7,3.9 8.7,8.7 -3.9,8.7 -8.7,8.7zm14.5,-25l6,-6 2,2c3.2,3.2 7.5,5.2 12.5,5.2v-5c-3.7,0 -7.2,-1.5 -10,-4l-4.5,-4.5c-1,-1 -2.2,-1.5 -3.5,-1.5 -1.5,0 -2.7,0.5 -3.7,1.5L41.7,45.5c-1,1 -1.2,2.2 -1.2,3.5 0,1.5 0.5,2.7 1.5,3.7l8.5,8.5v10.8h5v-12.8l-5.5,-5.5 2.5,-7.2zM73,52c-7,0 -12.5,5.5 -12.5,12.5s5.5,12.5 12.5,12.5 12.5,-5.5 12.5,-12.5 -5.5,-12.5 -12.5,-12.5zm0,21.2c-4.8,0 -8.7,-3.9 -8.7,-8.7s3.9,-8.7 8.7,-8.7 8.7,3.9 8.7,8.7 -3.9,8.7 -8.7,8.7z"/>
          </vector>
          EOF

          # Adaptive Icon Definitions
          cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          # Remove default fallback PNGs so Android loads the vector icons
          rm -f android/app/src/main/res/mipmap-*/ic_launcher.png
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_round.png
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_foreground.png

      - name: Ensure Persistent Signing Keystore
        run: |
          mkdir -p ~/.android
          if [ -f "persistent-keystore.jks" ]; then
            echo "Reusing existing persistent keystore from repository..."
            cp persistent-keystore.jks ~/.android/debug.keystore
          else
            echo "Generating persistent keystore for V2 for the first time..."
            keytool -genkeypair -v -keystore persistent-keystore.jks -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=RidePartnerV2,O=SportsScience,C=TR"
            cp persistent-keystore.jks ~/.android/debug.keystore

            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add persistent-keystore.jks
            git commit -m "chore: persist signing keystore for future seamless updates [skip ci]" || true
            git push origin main || true
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ride_Partner_V2_Release
          path: android/app/build/outputs/apk/debug/app-debug.apk
